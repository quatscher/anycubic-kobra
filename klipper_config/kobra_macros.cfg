# Makros fuer Anycubic Kobra Plus mit LeviQ-Homing
# Slicer Start-G-Code: PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature] FIRST_LAYER=[first_layer_height]
# Slicer End-G-Code:   PRINT_END

[exclude_object]

[gcode_macro PRINT_START]
description: Aufheizen, LeviQ-Homing bei stabilen 150 C, Mesh laden, Spuellinie
# Abstand Duese-Bett steckt jetzt im gemessenen probe z_offset (Papiertest 2026-10-24).
# z_extra nur noch fuer Feinkorrektur der ersten Schicht.
variable_z_extra: -0.12  # -0.17 nur wegen falscher 60C-Karte bei PETG noetig; mit kobra80 wieder -0.12 (2026-10-30)
gcode:
  {% set BED = params.BED|default(60)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(210)|float %}
  {% set FIRST_LAYER = params.FIRST_LAYER|default(0.2)|float %}
  # Sicherung: zu duenne erste Schicht drueckt die Duese aufs Bett
  {% if FIRST_LAYER < 0.15 %}
    {action_raise_error("PRINT_START abgebrochen: erste Schicht %.2f mm ist zu duenn (min. 0.15 mm)" % FIRST_LAYER)}
  {% endif %}
  SET_GCODE_OFFSET Z={z_extra}
  M140 S{BED}
  M104 S150
  M190 S{BED}
  # LeviQ braucht eine stabile Duesentemperatur, sonst loest er in der Luft aus
  # heisse Duese (z.B. nach Abbruch) mit Bauteilluefter schneller auf Antasttemperatur bringen
  {% if printer.extruder.temperature > 160 %}
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=155
    M107
  {% endif %}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=145 MAXIMUM=155
  G4 P5000
  G28
  _Z_CHECK
  # wie Anycubic (Z_PROBE_END_SCRIPT "G28"): nach mehrfachem Antasten Z neu referenzieren,
  # jedes Antasten kostet ~0.02 mm Schritte (2026-10-27) -> sonst Duese ~0.2 mm zu hoch
  G28 Z
  _LOAD_MESH_IF_PRESENT
  M109 S{EXTRUDER}
  G90
  M83
  G92 E0
  _PURGE_LINE
  G92 E0
  G1 Z2 F600

[gcode_macro _Z_CHECK]
description: Nach dem Homing in der Mitte 3x nachtasten und Z auf den Messwert korrigieren
gcode:
  G90
  G1 Z5 F600
  G1 X150 Y150 F6000
  PROBE SAMPLES=3
  _Z_CHECK_APPLY
  G1 Z5 F600

[gcode_macro _Z_CHECK_APPLY]
# Homing loeste vereinzelt ~0.4 mm zu tief aus (2026-10-24) -> Duese kratzte. Hier wird das abgefangen.
# 2026-10-27: Nur noch pruefen, nicht korrigieren - die Nachtast-Werte streuen/driften (bis 0.17 mm),
# die Korrektur hat die Streuung in die erste Schicht getragen (Spaghetti).
variable_max_dev: 0.3
gcode:
  # last_z_result ist ohne z_offset gespeichert -> Kontakthoehe = Ergebnis - z_offset
  {% set dz = printer.probe.last_z_result|float - printer.configfile.settings.probe.z_offset|float %}
  {% if dz|abs > max_dev %}
    {action_raise_error("Z-Check: Homing weicht %.3f mm vom Nachtasten ab - Druck abgebrochen, bitte Bett/Duese pruefen" % dz)}
  {% endif %}
  RESPOND MSG="Z-Check: Abweichung {'%.3f' % dz} mm (nur geprueft, nicht korrigiert)"

[gcode_macro _LOAD_MESH_IF_PRESENT]
# Bett verzieht sich bei 80 C anders als bei 60 C (vorne ~0.2 mm tiefer, 2026-10-30):
# PETG-Drucke (Bett >= 70) nutzen die bei 80 C gemessene Karte.
gcode:
  {% if printer.heater_bed.target >= 70 and "kobra80" in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=kobra80
    RESPOND MSG="Bed Mesh kobra80 geladen"
  {% elif "kobra" in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=kobra
    RESPOND MSG="Bed Mesh kobra geladen"
  {% else %}
    BED_MESH_CLEAR
    RESPOND MSG="Kein Bed Mesh gespeichert - drucke ohne"
  {% endif %}

[gcode_macro _PURGE_LINE]
description: Spuellinie vorne am Bettrand
gcode:
  G1 Z5 F600
  G1 X60 Y8 F6000
  G1 Z0.3 F600
  G1 X240 E9 F1200
  G1 Y8.5 F1200
  G1 X60 E9 F1200

[gcode_macro PRINT_END]
description: Zurueckziehen, Kopf anheben, Bett nach vorne, alles aus
gcode:
  {% set z = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
  G91
  G1 E-2 F1800
  G90
  G1 Z{z} F600
  G1 X10 Y280 F6000
  M104 S0
  M140 S0
  M106 S0
  M84

[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET_BASE
description: SET_GCODE_OFFSET mit Sicherung gegen zu tiefe Duese
# Tiefster erlaubter Z-Offset in mm (negativ = Duese naeher ans Bett)
variable_min_z: -0.25
gcode:
  {% set cur = printer.gcode_move.homing_origin.z %}
  {% if 'Z' in params %}
    {% set new = params.Z|float %}
  {% elif 'Z_ADJUST' in params %}
    {% set new = cur + params.Z_ADJUST|float %}
  {% else %}
    {% set new = cur %}
  {% endif %}
  {% if new < min_z %}
    {action_raise_error("SET_GCODE_OFFSET abgelehnt: Z-Offset %.3f mm waere tiefer als erlaubt (%.2f mm)" % (new, min_z))}
  {% endif %}
  _SET_GCODE_OFFSET_BASE {rawparams}

[gcode_macro _CLIENT_VARIABLE]
# Mainsail PAUSE/CANCEL_PRINT: Duese bei Abbruch 50 mm hoch und nach hinten, damit Filamentreste entfernt werden koennen (2026-10-27)
variable_use_custom_pos   : True
variable_custom_park_x    : 150.0
variable_custom_park_y    : 250.0
variable_custom_park_dz   : 50.0
variable_park_at_cancel   : True
variable_cancel_retract   : 5.0
gcode:

# BTT S2DW V1.0 (LIS2DW12, RP2040) - nur fuer Resonanzmessung.
# Wenn der Sensor abgesteckt ist, das include in printer.cfg auskommentieren,
# sonst startet Klipper nicht.
[mcu btt_lis2dw]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434041885111C-if00

[lis2dw]
cs_pin: btt_lis2dw:gpio9
spi_software_sclk_pin: btt_lis2dw:gpio10
spi_software_mosi_pin: btt_lis2dw:gpio11
spi_software_miso_pin: btt_lis2dw:gpio8
# Platine unter dem Heizblock: Drucker-X = Sensor-y, Sensor-z zeigt nach unten
axes_map: y, x, -z

[resonance_tester]
accel_chip: lis2dw
probe_points: 150, 150, 120

# fuer SET_KINEMATIC_POSITION (Z setzen ohne Probe, solange Sensor statt Duese dran ist)
[force_move]
enable_force_move: True

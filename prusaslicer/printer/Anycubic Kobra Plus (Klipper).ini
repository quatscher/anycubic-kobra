# Anycubic Kobra Plus - user preset (0.4 mm nozzle, direct drive, Marlin 2, LeviQ)
printer_technology = FFF
printer_settings_id = Anycubic Kobra Plus (Klipper)
printer_notes = Klipper auf Raspberry Pi (kobra.local). Homing und Spuellinie im Makro PRINT_START.
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 350
z_offset = 0
gcode_flavor = klipper
binary_gcode = 0
use_relative_e_distances = 1
use_firmware_retraction = 0
use_volumetric_e = 0
autoemit_temperature_commands = 0
thumbnails = 32x32/PNG, 300x300/PNG
nozzle_diameter = 0.4
extruders_count = 1
min_layer_height = 0.08
max_layer_height = 0.32
retract_length = 1
retract_speed = 40
deretract_speed = 0
retract_restart_extra = 0
retract_before_travel = 1.5
retract_layer_change = 1
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 349
travel_lift_before_obstacle = 0
wipe = 0
retract_length_toolchange = 4
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 1800,1800
machine_max_acceleration_y = 1800,1800
machine_max_acceleration_z = 100,100
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 1800,1800
machine_max_acceleration_retracting = 1800,1800
machine_max_acceleration_travel = 1800,1800
machine_max_feedrate_x = 300,300
machine_max_feedrate_y = 300,300
machine_max_feedrate_z = 10,10
machine_max_feedrate_e = 60,60
machine_max_jerk_x = 10,10
machine_max_jerk_y = 10,10
machine_max_jerk_z = 0.4,0.4
machine_max_jerk_e = 5,5
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
start_gcode = ; Kobra Plus / Klipper\nPRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature] FIRST_LAYER=[first_layer_height]
end_gcode = PRINT_END
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]\nG92 E0
toolchange_gcode =
color_change_gcode = M600
pause_print_gcode = M25
template_custom_gcode =
thumbnails_format = PNG

[include mainsail.cfg]
[include kobra_macros.cfg]
#[include s2dw.cfg]  # nur einkommentieren, wenn der S2DW-Sensor angesteckt ist

# This file contains a configuration for the Anycubic Kobra Plus printer.
#
# The Kobra Plus mainboard must be modified to correct conflicting UART
# addresses. As delivered, the X stepper and E0 stepper use UART address 0.
# To correct, move resistor R65 to R66. This moves the X stepper to address 3.
#
# After making this modification, any future firmwares will need to use the new
# address for the X stepper. To revert to the stock firmware, either undo the
# modification, or recompile the stock firmware using the correct addresses for
# X_SLAVE_ADDRESS and E0_SLAVE_ADDRESS.
#
# See docs/Config_Reference.md for a description of parameters.
#
# To build the firmware, use the following configuration:
#   - Micro-controller: Huada Semiconductor HC32F460
#   - Communication interface: Serial (PA3 & PA2) - Anycube
#   - Clock Speed: 200 MHz
#
# Installation:
#  1. Rename the klipper bin to `firmware.bin` and copy it to an SD Card.
#  2. Power off the Printer, insert the SD Card and power it on.
#  3. The printer should beep several times and the LCD will be stuck on the
#     Splash screen.

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1800
max_z_velocity: 10  # 40 war zu schnell: Z-Motoren haben ab ~15 mm/s Schritte verloren (2026-10-23)
max_z_accel: 50

[stepper_x]
step_pin: PA5
dir_pin: PA4
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_min: -4
position_endstop: -4
position_max: 304
homing_speed: 100

[tmc2209 stepper_x]
uart_pin: PA15
tx_pin: PA9
sense_resistor: 0.100
run_current: 0.9
uart_address: 3
stealthchop_threshold: 999999

[stepper_y]
step_pin: PC4
dir_pin: PA7
enable_pin: !PC3
microsteps: 16
rotation_distance: 32
endstop_pin: !PC5
position_min: -6
position_endstop: -6
position_max: 300
homing_speed: 100

[tmc2209 stepper_y]
uart_pin: PA15
tx_pin: PA9
sense_resistor: 0.100
run_current: 0.9
uart_address: 1
stealthchop_threshold: 999999

[stepper_z]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 350
homing_speed: 2.5  # 5 mm/s: erstes Anfahren drueckt zu hart, Z-Check danach +0.43 mm (2026-10-27)
second_homing_speed: 2.5  # wie Anycubic; 1 mm/s verlor ~0.015 mm pro Antastung (2026-10-27)

[tmc2209 stepper_z]
uart_pin: PA15
tx_pin: PA9
sense_resistor: 0.110  # wie Anycubic-Firmware (Z_RSENSE 0.11)
run_current: 1.3  # Anycubic Z_CURRENT 1300: EIN Treiber fuer BEIDE Z-Motoren, 0.9 war zu schwach -> Rattern/Schrittverlust (2026-10-26)
uart_address: 2
stealthchop_threshold: 999999  # StealthChop wie Anycubic-Firmware

[stepper_z1]
step_pin: PB1
dir_pin: !PB0
enable_pin: !PC3
microsteps: 16
rotation_distance: 8

[extruder]
max_extrude_only_distance: 200
max_extrude_only_velocity: 60
max_extrude_only_accel: 3000
step_pin: PC14
dir_pin: !PC15
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.901  # Anycubic E-Steps 405 (3200/405); Vorlage 7.71 = 415 -> ~2.5% Ueberextrusion (2026-10-26)
nozzle_diameter: 0.400
filament_diameter: 1.750
# PA-Turm 2026-10-22 (eSUN ePETG+HS): Ecken durchgaengig gut, Standardwert gewaehlt
pressure_advance: 0.05
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_extrude_temp: 170
#control: pid
#pid_kp: 22.20
#pid_ki: 1.08
#pid_kd: 119.0
min_temp: 0
max_temp: 275

[tmc2208 extruder]
uart_pin: PA15
tx_pin: PA9
sense_resistor: 0.100
run_current: 0.8
uart_address: 0
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
#control: pid
#pid_kp: 97.1
#pid_ki: 1.41
#pid_kd: 1675.16
min_temp: 0
max_temp: 120

[filament_switch_sensor runout]
pause_on_runout: True
switch_pin: !PC13

[controller_fan controller_fan]
pin: PA14
heater: heater_bed

[heater_fan hotend_fan]
pin: PA13

[fan]
pin: PB9

[probe]
pin: !PB6
speed: 2.5  # wie Anycubic Z_PROBE_FEEDRATE_SLOW; bei 1 mm/s driftete jede Antastung ~0.015 mm (2026-10-27)
lift_speed: 5
samples: 3
samples_result: median
samples_tolerance: 0.05
sample_retract_dist: 5
samples_tolerance_retries: 5
z_offset: -0.10  # Papiertest 2026-10-24: Papier kratzt kalt bei Z 0.2-0.3 -> Bett ~0.15 ueber Ausloesepunkt (Federbett gibt nach)
activate_gcode: probe_reset

[output_pin probe_reset_pin]
pin: PB7
value: 1

[force_move]
# erlaubt SET_KINEMATIC_POSITION, z.B. Duese nach Notaus ohne Homing anheben
enable_force_move: True

[safe_z_home]
home_xy_position: 150, 150
speed: 100
z_hop: 10
z_hop_speed: 15
move_to_previous: False

[bed_mesh]
speed: 50
mesh_min: 10, 10
mesh_max: 290, 290
algorithm: bicubic
probe_count: 5, 5
zero_reference_position: 150, 150
horizontal_move_z: 3

[gcode_macro probe_reset]
gcode:
  G4 P300
  SET_PIN PIN=probe_reset_pin VALUE=0
  G4 P300
  SET_PIN PIN=probe_reset_pin VALUE=1
  G4 P100

[output_pin LED]
pin: PB8

[output_pin beeper]
pin: PB5

[input_shaper]
# X gemessen 2026-10-22 mit BTT S2DW am Heizblock (Peaks 57 Hz in X, 120 Hz quer)
shaper_type_x: 2hump_ei
shaper_freq_x: 94.2
# Y gemessen 2026-10-22, Sensor auf dem Bett (Peaks 24 Hz in Y, 31 Hz in Z)
shaper_type_y: 2hump_ei
shaper_freq_y: 41.0

